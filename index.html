				var local = link.getAttribute("data-fallback");
				if (!local) {
					return;

				link.removeAttribute("data-fallback");
				link.removeAttribute("integrity");
				link.removeAttribute("crossorigin");
				link.href = local;
			}
			// A blocked CDN can hang instead of failing, which would hold up the whole page.
			setTimeout(function () {
				Array.prototype.forEach.call(document.querySelectorAll("link[data-fallback]"), function (link) {
					if (!link.sheet) {
						cssFallback(link);
					}
				});
			}, 4000);
		</script>

		<link rel="stylesheet" href="assets/style.css?v=2026-10-11" />
	</head>

	<body>

			</header>

			<div class="shadow mx-auto m-1 py-3 px-3 rounded calc-card">
				<p class="mb-4 intro">Calculate a <a class="link-secondary" href="https://en.wikipedia.org/wiki/Gestational_age" target="_blank">gestational age</a> based off two values (live updating)</p>

				<noscript><p class="load-error">This calculator needs JavaScript to run.</p></noscript>
				<p id="loadError" class="load-error" hidden>The calculator could not load. Check your connection, then reload the page.</p>

				<div id="selectionBar" role="group" aria-label="Choose which value to calculate" class="btn-group my-2 w-100">
					<input type="radio" class="btn-check" name="options" id="option1" autocomplete="off" />
					<label class="btn btn-outline-secondary" for="option1" aria-label="Calculate estimated due date">EDD</label>

					<input type="radio" class="btn-check" name="options" id="option2" autocomplete="off" />
					<label class="btn btn-outline-secondary" for="option2" aria-label="Calculate the calculation date">Date</label>

					<input type="radio" class="btn-check" name="options" id="option3" autocomplete="off" checked="" />
					<label class="btn btn-outline-secondary" for="option3" aria-label="Calculate gestational age">GA</label>
				</div>

				<div class="row fields">
					<div class="col-12 col-md field" data-field="edd">
						<div class="field-top">
							<label class="py-1" for="EDDDatepicker">Estimated Due Date (EDD):</label>
							<span class="calculated-tag">Calculated</span>
						</div>
						<div class="field-input">
							<input type="text" id="EDDDatepicker" class="form-control" placeholder="DD/MM/YYYY, 3 Jul or t+3" autocomplete="off" autocapitalize="off" spellcheck="false" />
							<button type="button" class="btn mx-0 icon-btn calendar-btn" data-calendar="edd" title="Open the calendar" aria-label="Pick the estimated due date from a calendar">
								<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
									<path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z" />
								</svg>
							</button>
						</div>
						<div class="invalid-feedback">Invalid date format</div>
						<div class="copy-row" data-copies="edd"></div>
					</div>

					<div class="col-12 col-md field" data-field="date">
						<div class="field-top">
							<label class="py-1" for="dateFromDatepicker">Calculation date:</label>
							<span class="calculated-tag">Calculated</span>
						</div>
						<div class="field-input">
							<input type="text" id="dateFromDatepicker" class="form-control" placeholder="DD/MM/YYYY, or t for today" autocomplete="off" autocapitalize="off" spellcheck="false" />
							<button type="button" class="btn mx-0 icon-btn calendar-btn" data-calendar="date" title="Open the calendar" aria-label="Pick the calculation date from a calendar">
								<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
									<path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z" />
								</svg>
							</button>
						</div>
						<div class="invalid-feedback">Invalid date format</div>
						<div class="copy-row" data-copies="date"></div>
					</div>

					<div class="col-12 col-md field" data-field="ga">
						<div class="field-top">
							<label class="py-1" for="gestationalAge">Gestational Age (Weeks+days):</label>
							<span class="calculated-tag">Calculated</span>
						</div>
						<div class="field-input">
							<input type="text" id="gestationalAge" class="form-control" placeholder="39+2 or 39w2d" autocomplete="off" autocapitalize="off" spellcheck="false" />
						</div>
						<div class="invalid-feedback">Invalid gestational age format</div>
						<div class="field-note" id="gestationalAgeNote"></div>
						<div class="copy-row" data-copies="ga"></div>
					</div>
				</div>
			</div>
		</div>

		<script src="assets/load.js?v=2026-10-10"></script>
